<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
</head>
<body>
    <script>
        window.addEventListener('message', (event) => {
            const data = event.data;
            if (data.action !== 'play') return;

            const audio = new Audio(`sounds/${data.name}.ogg`);
            audio.volume = Math.min(1, Math.max(0, data.volume ?? 1));
            audio.play().catch(() => {});
        });
    </script>
</body>
</html>
